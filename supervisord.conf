[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:api]
command=/app/.venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=1

[program:ui]
command=/app/.venv/bin/streamlit run app/agent/streamlit_app.py
    --server.port 8501
    --server.address 0.0.0.0
    --server.headless true
    --server.enableCORS false
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=2
