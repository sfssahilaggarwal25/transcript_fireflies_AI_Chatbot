[project]
name = "fireflies-transcript-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "deepeval>=4.0.3",
    "fastapi>=0.136.1",
    "google-generativeai>=0.8.6",
    "langchain>=1.3.0",
    "langchain-chroma>=1.1.0",
    "langchain-google-genai>=4.2.2",
    "load-dotenv>=0.1.0",
    "numpy>=2.4.4",
    "pip>=26.1",
    "rank-bm25>=0.2.2",
    "requests",
    "streamlit>=1.57.0",
    "uvicorn>=0.46.0",
    "psycopg2-binary>=2.9.9",
]

# onnxruntime is a declared dep of chromadb but is NEVER imported in this app
# (we use GeminiEmbeddings — chromadb's ONNX function is lazy and never called).
# Overriding it to a never-true marker removes it from the lock entirely,
# so deployment works on platforms with no onnxruntime wheels (e.g. SCC).
[tool.uv]
override-dependencies = [
    "onnxruntime ; python_version < '2'",
]
